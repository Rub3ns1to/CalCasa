name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto y desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint con Ruff
        run: ruff check src scripts tests

      - name: Ejecutar suite de tests con pytest
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker de producción
        run: docker build -t tasador-inmobiliario:ci .

      - name: Verificar arranque y /api/health en contenedor
        run: |
          docker run -d --name tasador-ci -p 8000:8000 tasador-inmobiliario:ci
          python -c "
          import json, time, urllib.request
          for _ in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2) as res:
                      body = json.loads(res.read().decode())
                      print('Health:', body)
                      assert res.status == 200
                      assert body['model_loaded'] is True
                      assert body['vision_mode'] == 'demo'
                      assert body['byok_supported'] is True
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Timeout esperando a /api/health en contenedor')
          "

      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f tasador-ci || true
